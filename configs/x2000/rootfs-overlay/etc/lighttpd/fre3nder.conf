# Fre3nder platform HTTP service. S62 supplies only the selected document root.
# See docs/apps.md for the pinned package and Moonraker routing provenance.
server.modules = ( "mod_indexfile", "mod_setenv", "mod_proxy", "mod_staticfile" )
server.bind = "0.0.0.0"
server.port = 80
server.username = "nobody"
server.groupname = "nobody"
server.follow-symlink = "disable"
index-file.names = ( "index.html" )
server.upload-dirs = ( "/tmp" )
server.stream-request-body = 2
server.stream-response-body = 2
mimetype.assign = (
    ".html" => "text/html; charset=utf-8",
    ".css" => "text/css; charset=utf-8",
    ".js" => "text/javascript; charset=utf-8",
    ".mjs" => "text/javascript; charset=utf-8",
    ".json" => "application/json",
    ".webmanifest" => "application/manifest+json",
    ".svg" => "image/svg+xml",
    ".png" => "image/png",
    ".jpg" => "image/jpeg",
    ".jpeg" => "image/jpeg",
    ".webp" => "image/webp",
    ".gif" => "image/gif",
    ".ico" => "image/x-icon",
    ".woff" => "font/woff",
    ".woff2" => "font/woff2",
    ".ttf" => "font/ttf",
    ".wasm" => "application/wasm",
    "" => "application/octet-stream"
)

# Moonraker uses Tornado xheaders. Discard client-supplied identity headers;
# mod_proxy supplies X-Forwarded-For from the actual connection address.
setenv.set-request-header = (
    "X-Real-IP" => "",
    "X-Forwarded-For" => "",
    "X-Forwarded-Proto" => "",
    "X-Scheme" => ""
)

$HTTP["url"] =~ "^/(websocket$|(printer|api|access|machine|server)(/|$))" {
    proxy.server = ( "" => (( "host" => "127.0.0.1", "port" => 17126 )) )
    proxy.header = ( "upgrade" => "enable" )
}
