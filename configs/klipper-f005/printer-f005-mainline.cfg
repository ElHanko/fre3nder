# HARDWARE-VALIDATED MOTION/HEATER REFERENCE BASELINE
# Filament change/recovery was tested at the former front probe point.
# The new rear recovery point still needs physical validation.
# Investigated F005/GD32F303RET6 reference only; other printers must be
# independently calibrated and validated before homing, heating, or printing.
# This configuration does not establish Gate 1/recovery readiness.
# For the investigated F005/GD32F303RET6 reference only.

[mcu]
serial: /dev/ttyS1
baud: 230400
restart_method: command
x2000_passive_uart: True

[mcu rpi]
serial: /tmp/klipper_host_mcu

[adxl345]
cs_pin: rpi:None
spi_speed: 2000000
spi_bus: spidev2.0
axes_map: z,y,x

[resonance_tester]
accel_chip: adxl345
accel_per_hz: 50
probe_points: 117.5,117.5,100
max_freq: 100

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 62.4
shaper_type_y: mzv
shaper_freq_y: 39.8

[printer]
kinematics: cartesian
max_velocity: 500
max_accel: 4500
max_z_velocity: 30
max_z_accel: 300
square_corner_velocity: 5.0

[stepper_x]
step_pin: PC2
dir_pin: !PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: !PA5
position_endstop: -12
position_min: -12
position_max: 221
homing_speed: 30
homing_retract_dist: 0

[tmc2208 stepper_x]
uart_pin: PB12
interpolate: True
run_current: 0.75
sense_resistor: 0.150
stealthchop_threshold: 0

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 60
endstop_pin: !PA6
position_endstop: -20
position_min: -20
position_max: 223
homing_speed: 30
homing_retract_dist: 0

[tmc2208 stepper_y]
uart_pin: PB13
interpolate: True
run_current: 0.75
sense_resistor: 0.150
stealthchop_threshold: 0

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 246
position_min: -5

[tmc2208 stepper_z]
uart_pin: PB14
interpolate: True
run_current: 0.8
sense_resistor: 0.150
stealthchop_threshold: 0

[bltouch]
sensor_pin: PC14
control_pin: PC13
x_offset: 0
y_offset: 27
# Reference-device calibration qualified on 2026-08-29: a controlled cold
# PROBE_CALIBRATE/paper test produced 2.180 mm after an initial 2.177 mm result.
# Reference baseline only: recalibrate on every other printer.
z_offset: 2.180
probe_with_touch_mode: True
stow_on_each_sample: False
speed: 5
lift_speed: 20

[safe_z_home]
home_xy_position: 110, 83
z_hop: 5
z_hop_speed: 20

[extruder]
max_extrude_only_distance: 1000
max_extrude_cross_section: 80
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
rotation_distance: 7.53
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
# Reference F005 PID baseline, validated during the controlled bring-up/print.
# These values are not universal; recalibrate if the heater, sensor, or board
# differs.
control: pid
pid_Kp: 20.584
pid_Ki: 1.737
pid_Kd: 60.981
min_temp: 0
max_temp: 320

[heater_bed]
heater_pin: PB2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
# Reference F005 PID baseline, validated during the controlled bring-up/print.
# These values are not universal; recalibrate if the heater, sensor, or board
# differs.
control: pid
pid_Kp: 70.652
pid_Ki: 1.798
pid_Kd: 694.157
min_temp: 0
max_temp: 120

[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 10

[fan]
pin: PA0
cycle_time: 0.010
hardware_pwm: False

[heater_fan hotend_fan]
pin: PC1
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.010
hardware_pwm: False
kick_start_time: 0.100
off_below: 0.0
heater: extruder
fan_speed: 1.0
heater_temp: 60.0

# Optional mainboard fan output (PB1).
# Not used by the stock Ender-3 V3 KE hardware.
# Uncomment the following lines if needed for hardware modifications.
#
#[output_pin mainboard_fan]
#pin: !PB1

[pause_resume]

[exclude_object]

[filament_switch_sensor filament_sensor]
switch_pin: !PC15
pause_on_runout: True

[bed_mesh]
speed: 350
mesh_min: 5, 10
mesh_max: 215, 215
probe_count: 5, 5
fade_start: 1
fade_end: 10
fade_target: 0
horizontal_move_z: 8

[virtual_sdcard]
path: /home/fre3nder/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[display_status]

[fre3nder_filament_recovery]
# Nozzle X10/Y178 puts the reference BLTouch at X10/Y205 (rear left).
# This rear candidate needs hardware validation and a clear path for each part.
# Normal G28/safe_z_home is unchanged. Adapt this point for modified printers.
home_xy_position: 10, 178
# Enable only after hardware validation of this point and the complete paths.
# RESUME cannot start recovery homing with this default; RECOVER_HOMING is
# separately available for deliberate, supervised diagnosis/qualification.
automatic_recovery: False
probe_lift: 8
travel_speed: 20

# Filament handling uses upstream pause_resume's PAUSE_STATE. Coordinates below
# are the original OrcaSlicer start-purge path, outside the printable X area.
# Existing persistent printer.cfg files are never automatically replaced.
[gcode_macro _FILAMENT_SETTINGS]
variable_purge_x: -2.0
variable_purge_x2: -1.7
variable_purge_y: 20.0
variable_purge_y_end: 145.0
variable_purge_y_finish: 30.0
variable_purge_length: 30.0
variable_load_length: 50.0
variable_unload_length: 60.0
variable_filament_speed: 300.0
variable_retract: 1.0
variable_retract_speed: 1800.0
variable_z_lift: 50.0
variable_min_lift: 2.0
variable_purge_min_z: 5.0
variable_travel_speed: 5000.0
variable_z_speed: 900.0
variable_pause_timeout: 300.0
gcode:

[idle_timeout]
timeout: 600
gcode:
    {% if printer.pause_resume.is_paused %}
        _FILAMENT_POWER_OFF
    {% else %}
        TURN_OFF_HEATERS
        M84
    {% endif %}

[gcode_macro PAUSE]
description: Pause and park for a filament change
rename_existing: PAUSE_BASE
variable_active: 0
variable_hotend_target: 0.0
variable_idle_timeout: 600.0
variable_retracted: 0.0
variable_resume_x: 0.0
variable_resume_y: 0.0
variable_resume_z: 0.0
gcode:
    {% if not printer.pause_resume.is_paused %}
        {% set c = printer['gcode_macro _FILAMENT_SETTINGS'] %}
        {% if c.pause_timeout <= 0 %}
            {action_raise_error("Set pause_timeout > 0")}
        {% endif %}
        {% set retract = c.retract if printer.extruder.can_extrude else 0.0 %}
        PAUSE_BASE
        FILAMENT_RECOVERY_CAPTURE
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=active VALUE=1
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=hotend_target VALUE={printer.extruder.target}
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=idle_timeout VALUE={printer.idle_timeout.idle_timeout}
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=resume_x VALUE={printer.gcode_move.position.x}
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=resume_y VALUE={printer.gcode_move.position.y}
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=resume_z VALUE={printer.gcode_move.position.z}
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=retracted VALUE={retract}
        SET_IDLE_TIMEOUT TIMEOUT={c.pause_timeout}
        UPDATE_DELAYED_GCODE ID=_FILAMENT_POWER_OFF DURATION={c.pause_timeout}
        SAVE_GCODE_STATE NAME=FILAMENT_RETRACT
        M83
        M221 S100
        M220 S100
        {% if retract > 0 %}
            G1 E-{retract} F{c.retract_speed}
        {% endif %}
        RESTORE_GCODE_STATE NAME=FILAMENT_RETRACT
        _FILAMENT_TRAVEL X={c.purge_x} Y={c.purge_y} ON_PAUSE=1
        M400
        FILAMENT_RECOVERY_PARKED
    {% endif %}

[gcode_macro _FILAMENT_TRAVEL]
description: Lift before XY travel, preserving G-code modes and offsets
gcode:
    {% set c = printer['gcode_macro _FILAMENT_SETTINGS'] %}
    {% set p = printer['gcode_macro PAUSE'] %}
    {% set pos = printer.gcode_move.position %}
    {% set gpos = printer.gcode_move.gcode_position %}
    {% set low = printer.toolhead.axis_minimum %}
    {% set high = printer.toolhead.axis_maximum %}
    {% set x = params.X|float %}
    {% set y = params.Y|float %}
    {% set z = [[pos.z, p.resume_z + c.z_lift, c.purge_min_z]|max, high.z]|min %}
    {% set error = '' %}
    {% if not printer.pause_resume.is_paused or printer.toolhead.homed_axes != 'xyz' %}
        {% set error = 'Filament travel requires a pause and homed XYZ; do not home over a print' %}
    {% elif x < low.x or x > high.x or y < low.y or y > high.y %}
        {% set error = 'Filament position is outside the axis limits' %}
    {% elif c.min_lift <= 0 or z < p.resume_z + c.min_lift or z < pos.z %}
        {% set error = 'Insufficient Z clearance; leave paused or cancel the print' %}
    {% endif %}
    {% if error %}
        {% if params.ON_PAUSE|default(0)|int %}
            # A refused park must not turn an SD-file PAUSE into a print error.
            {action_respond_info("Paused without parking: " ~ error)}
        {% else %}
            {action_raise_error(error)}
        {% endif %}
    {% else %}
        SAVE_GCODE_STATE NAME=FILAMENT_TRAVEL
        G90
        M220 S100
        G1 Z{z - (pos.z - gpos.z)} F{c.z_speed}
        G1 X{x - (pos.x - gpos.x)} Y{y - (pos.y - gpos.y)} F{c.travel_speed}
        RESTORE_GCODE_STATE NAME=FILAMENT_TRAVEL
    {% endif %}

[gcode_macro LOAD]
description: Load filament while paused; LENGTH in mm, optional TEMPERATURE
gcode:
    {% set c = printer['gcode_macro _FILAMENT_SETTINGS'] %}
    _FILAMENT_EXTRUDE LENGTH={params.LENGTH|default(c.load_length)} DIRECTION=1 TEMPERATURE={params.TEMPERATURE|default(printer['gcode_macro PAUSE'].hotend_target)}

[gcode_macro UNLOAD]
description: Unload filament while paused; LENGTH in mm, optional TEMPERATURE
gcode:
    {% set c = printer['gcode_macro _FILAMENT_SETTINGS'] %}
    _FILAMENT_EXTRUDE LENGTH={params.LENGTH|default(c.unload_length)} DIRECTION=-1 TEMPERATURE={params.TEMPERATURE|default(printer['gcode_macro PAUSE'].hotend_target)}

[gcode_macro _FILAMENT_EXTRUDE]
gcode:
    {% set c = printer['gcode_macro _FILAMENT_SETTINGS'] %}
    {% set e = printer.configfile.settings.extruder %}
    {% set length = params.LENGTH|float %}
    {% set target = params.TEMPERATURE|float %}
    {% if not printer.pause_resume.is_paused %}
        {action_raise_error("Pause before loading or unloading filament")}
    {% endif %}
    {% set recovery = printer.fre3nder_filament_recovery %}
    {% if recovery.powered_down and not recovery.ready %}
        {action_raise_error("Recovery homing is required; inspect the print and homing paths, then press RESUME before loading or unloading")}
    {% endif %}
    {% if length <= 0 or length > e.max_extrude_only_distance %}
        {action_raise_error("Invalid filament LENGTH")}
    {% endif %}
    {% if target < e.min_extrude_temp or target > e.max_temp %}
        {action_raise_error("Specify a suitable TEMPERATURE for this filament")}
    {% endif %}
    M109 S{target}
    SAVE_GCODE_STATE NAME=FILAMENT_EXTRUDE
    M83
    M220 S100
    M221 S100
    G1 E{length * params.DIRECTION|float} F{c.filament_speed}
    RESTORE_GCODE_STATE NAME=FILAMENT_EXTRUDE

[gcode_macro PURGE]
description: Purge above the start-purge area while paused; optional LENGTH and TEMPERATURE
gcode:
    {% set c = printer['gcode_macro _FILAMENT_SETTINGS'] %}
    {% set e = printer.configfile.settings.extruder %}
    {% set length = params.LENGTH|default(c.purge_length)|float %}
    {% set target = params.TEMPERATURE|default(printer['gcode_macro PAUSE'].hotend_target)|float %}
    {% if not printer.pause_resume.is_paused %}
        {action_raise_error("Pause before purging filament")}
    {% endif %}
    {% set recovery = printer.fre3nder_filament_recovery %}
    {% if recovery.powered_down and not recovery.ready %}
        {action_raise_error("Recovery homing is required; inspect the print and homing paths, then press RESUME before purging")}
    {% endif %}
    {% if length <= 0 or length > e.max_extrude_only_distance %}
        {action_raise_error("Invalid purge LENGTH")}
    {% endif %}
    {% if target < e.min_extrude_temp or target > e.max_temp %}
        {action_raise_error("Specify a suitable TEMPERATURE for this filament")}
    {% endif %}
    _FILAMENT_TRAVEL X={c.purge_x} Y={c.purge_y}
    M109 S{target}
    SAVE_GCODE_STATE NAME=FILAMENT_PURGE
    G90
    M83
    M220 S100
    M221 S100
    _PURGE_LINE LENGTH={length}
    RESTORE_GCODE_STATE NAME=FILAMENT_PURGE

[gcode_macro _PURGE_LINE]
description: Shared two-line XY path for START_PURGE and paused PURGE
gcode:
    {% set c = printer['gcode_macro _FILAMENT_SETTINGS'] %}
    {% set pos = printer.gcode_move.position %}
    {% set gpos = printer.gcode_move.gcode_position %}
    {% set ox = pos.x - gpos.x if printer.pause_resume.is_paused else 0.0 %}
    {% set oy = pos.y - gpos.y if printer.pause_resume.is_paused else 0.0 %}
    {% set low = printer.toolhead.axis_minimum %}
    {% set high = printer.toolhead.axis_maximum %}
    {% set length = params.LENGTH|float %}
    {% if not printer.extruder.can_extrude or printer.toolhead.homed_axes != 'xyz' %}
        {action_raise_error("Purge requires a hot nozzle and homed XYZ")}
    {% endif %}
    {% if length <= 0 or length > printer.configfile.settings.extruder.max_extrude_only_distance %}
        {action_raise_error("Invalid purge LENGTH")}
    {% endif %}
    {% if c.purge_x2 < low.x or c.purge_x2 > high.x or c.purge_y_end < low.y or c.purge_y_end > high.y or c.purge_y_finish < low.y or c.purge_y_finish > high.y %}
        {action_raise_error("Purge line is outside the axis limits")}
    {% endif %}
    G1 Y{c.purge_y_end - oy} E{length / 2.0} F1500
    G1 X{c.purge_x2 - ox} F{c.travel_speed}
    G1 Y{c.purge_y_finish - oy} E{length / 2.0} F1500

[gcode_macro START_PURGE]
description: Original OrcaSlicer start purge using the shared XY path
gcode:
    {% set c = printer['gcode_macro _FILAMENT_SETTINGS'] %}
    {% set target = params.TEMPERATURE|float %}
    {% set e = printer.configfile.settings.extruder %}
    {% if printer.pause_resume.is_paused or printer.toolhead.homed_axes != 'xyz' %}
        {action_raise_error("Start purge requires homed XYZ and no active pause")}
    {% endif %}
    {% if target < e.min_extrude_temp or target > e.max_temp %}
        {action_raise_error("Invalid start purge TEMPERATURE")}
    {% endif %}
    G90
    M83
    M104 S{target}
    G92 E0
    G1 X{c.purge_x} Y{c.purge_y} Z0.3 F{c.travel_speed}
    M109 S{target}
    G1 Z0.2
    _PURGE_LINE LENGTH={c.purge_length}
    G92 E0

[gcode_macro RESUME]
description: Resume a pause, or recover reference and wait for a second RESUME
rename_existing: RESUME_BASE
gcode:
    {% set p = printer['gcode_macro PAUSE'] %}
    {% if not printer.pause_resume.is_paused or not p.active %}
        {action_raise_error("No filament pause to resume")}
    {% endif %}
    {% set velocity = params.VELOCITY|default(printer.configfile.settings.pause_resume.recover_velocity)|float %}
    {% if velocity <= 0 %}
        {action_raise_error("RESUME VELOCITY must be positive")}
    {% endif %}
    {% if printer.fre3nder_filament_recovery.powered_down or printer.toolhead.homed_axes != 'xyz' %}
        _FILAMENT_RECOVERY_RESUME VELOCITY={velocity}
    {% else %}
        {% set sensor = printer['filament_switch_sensor filament_sensor'] %}
        {% if sensor.enabled and not sensor.filament_detected %}
            {action_raise_error("Insert filament before resuming")}
        {% endif %}
        {% set e = printer.configfile.settings.extruder %}
        {% if p.hotend_target < e.min_extrude_temp or p.hotend_target > e.max_temp %}
            {action_raise_error("The saved print temperature is unsuitable for extrusion")}
        {% endif %}
        M109 S{p.hotend_target}
        _FILAMENT_RESUME VELOCITY={velocity}
    {% endif %}

[gcode_macro _FILAMENT_RESUME]
gcode:
    {% set c = printer['gcode_macro _FILAMENT_SETTINGS'] %}
    {% set p = printer['gcode_macro PAUSE'] %}
    {% if not printer.extruder.can_extrude %}
        {action_raise_error("Wait for the hotend before resuming")}
    {% endif %}
    _FILAMENT_TRAVEL X={c.purge_x2} Y={c.purge_y_finish}
    SAVE_GCODE_STATE NAME=FILAMENT_UNRETRACT
    M83
    M220 S100
    M221 S100
    {% if p.retracted > 0 %}
        G1 E{p.retracted} F{c.retract_speed}
    {% endif %}
    RESTORE_GCODE_STATE NAME=FILAMENT_UNRETRACT
    _FILAMENT_TRAVEL X={p.resume_x} Y={p.resume_y}
    _FILAMENT_RESET
    RESUME_BASE VELOCITY={params.VELOCITY}

[gcode_macro _FILAMENT_RESET]
gcode:
    {% set p = printer['gcode_macro PAUSE'] %}
    UPDATE_DELAYED_GCODE ID=_FILAMENT_POWER_OFF DURATION=0
    {% if p.active %}
        SET_IDLE_TIMEOUT TIMEOUT={p.idle_timeout}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=active VALUE=0
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=retracted VALUE=0.0
    FILAMENT_RECOVERY_RESET

[gcode_macro CLEAR_PAUSE]
rename_existing: CLEAR_PAUSE_BASE
gcode:
    {% if printer.pause_resume.is_paused and printer['gcode_macro PAUSE'].active %}
        {action_raise_error("Use CANCEL_PRINT to discard the captured filament pause")}
    {% endif %}
    _FILAMENT_RESET
    CLEAR_PAUSE_BASE

[gcode_macro _FILAMENT_POWER_OFF]
gcode:
    {% if printer.pause_resume.is_paused and printer['gcode_macro PAUSE'].active %}
        FILAMENT_RECOVERY_POWER_OFF
        TURN_OFF_HEATERS
        M84
        {action_respond_info("Print remains paused with heaters and motors off. Inspect adhesion and the homing paths before pressing RESUME.")}
    {% endif %}

[delayed_gcode _FILAMENT_POWER_OFF]
gcode:
    _FILAMENT_POWER_OFF

[gcode_macro CANCEL_PRINT]
description: Cancel the current print
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    _FILAMENT_RESET
    # The upstream base cancels the SD job and clears pause itself. A separate
    # SDCARD_RESET_FILE is forbidden inside virtual_sdcard's on_error_gcode.
    CANCEL_PRINT_BASE
    # A cooled pause is already Idle; do not wait for another idle transition.
    M84
