# HARDWARE-VALIDATED REFERENCE BASELINE
# Investigated F005/GD32F303RET6 reference only; other printers must be
# independently calibrated and validated before homing, heating, or printing.
# This configuration does not establish Gate 1/recovery readiness.
# For the investigated F005/GD32F303RET6 reference only.

[mcu]
serial: /dev/ttyS1
baud: 230400
restart_method: command
x2000_passive_uart: True

[mcu rpi]
serial: /tmp/klipper_host_mcu

[adxl345]
cs_pin: rpi:None
spi_speed: 2000000
spi_bus: spidev2.0
axes_map: z,y,x

[resonance_tester]
accel_chip: adxl345
accel_per_hz: 50
probe_points: 117.5,117.5,100
max_freq: 80

[input_shaper]

[printer]
kinematics: cartesian
max_velocity: 500
max_accel: 8000
max_z_velocity: 30
max_z_accel: 300
square_corner_velocity: 5.0

[stepper_x]
step_pin: PC2
dir_pin: !PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: !PA5
position_endstop: -12
position_min: -12
position_max: 221
homing_speed: 30
homing_retract_dist: 0

[tmc2208 stepper_x]
uart_pin: PB12
interpolate: True
run_current: 0.75
sense_resistor: 0.150
stealthchop_threshold: 0

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 60
endstop_pin: !PA6
position_endstop: -20
position_min: -20
position_max: 223
homing_speed: 30
homing_retract_dist: 0

[tmc2208 stepper_y]
uart_pin: PB13
interpolate: True
run_current: 0.75
sense_resistor: 0.150
stealthchop_threshold: 0

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 246
position_min: -5

[tmc2208 stepper_z]
uart_pin: PB14
interpolate: True
run_current: 0.8
sense_resistor: 0.150
stealthchop_threshold: 0

[bltouch]
sensor_pin: PC14
control_pin: PC13
x_offset: 0
y_offset: 27
# Reference-device calibration qualified on 2026-08-29: a controlled cold
# PROBE_CALIBRATE/paper test produced 2.180 mm after an initial 2.177 mm result.
# Reference baseline only: recalibrate on every other printer.
z_offset: 2.180
probe_with_touch_mode: True
stow_on_each_sample: False
speed: 5
lift_speed: 20

[safe_z_home]
home_xy_position: 110, 83
z_hop: 5
z_hop_speed: 20

[extruder]
max_extrude_only_distance: 1000
max_extrude_cross_section: 80
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
rotation_distance: 7.53
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
# Reference F005 PID baseline, validated during the controlled bring-up/print.
# These values are not universal; recalibrate if the heater, sensor, or board
# differs.
control: pid
pid_Kp: 20.584
pid_Ki: 1.737
pid_Kd: 60.981
min_temp: 0
max_temp: 320

[heater_bed]
heater_pin: PB2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
# Reference F005 PID baseline, validated during the controlled bring-up/print.
# These values are not universal; recalibrate if the heater, sensor, or board
# differs.
control: pid
pid_Kp: 70.652
pid_Ki: 1.798
pid_Kd: 694.157
min_temp: 0
max_temp: 120

[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 10

[fan]
pin: PA0
cycle_time: 0.010
hardware_pwm: False

[heater_fan hotend_fan]
pin: PC1
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.010
hardware_pwm: False
kick_start_time: 0.100
off_below: 0.0
heater: extruder
fan_speed: 1.0
heater_temp: 60.0

[output_pin mainboard_fan]
pin: !PB1

[pause_resume]

[exclude_object]

[filament_switch_sensor filament_sensor]
switch_pin: !PC15
pause_on_runout: True

[bed_mesh]
speed: 350
mesh_min: 5, 10
mesh_max: 215, 215
probe_count: 5, 5
fade_start: 1
fade_end: 10
fade_target: 0
horizontal_move_z: 8

[virtual_sdcard]
path: /home/fre3nder/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[display_status]

[gcode_macro CANCEL_PRINT]
description: Cancel the current print
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    CANCEL_PRINT_BASE
